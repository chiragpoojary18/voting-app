<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Results</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f0f4ff; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 90%; max-width: 520px; }
    h1 { font-size: 1.6rem; color: #1a1a2e; margin-bottom: 6px; text-align: center; }
    .subtitle { text-align: center; color: #888; font-size: 0.9rem; margin-bottom: 28px; }
    .result-item { margin-bottom: 20px; }
    .result-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .result-name { font-weight: bold; color: #1a1a2e; }
    .result-votes { font-size: 0.9rem; color: #4361ee; font-weight: bold; }
    .bar-bg { background: #e0e7ff; border-radius: 99px; height: 12px; overflow: hidden; }
    .bar-fill { height: 100%; background: #4361ee; border-radius: 99px; transition: width 0.6s ease; }
    .winner-badge { font-size: 0.75rem; background: #fef9c3; color: #854d0e; border-radius: 99px; padding: 2px 10px; font-weight: bold; margin-left: 8px; }
    .nav { text-align: center; margin-top: 24px; font-size: 0.9rem; }
    .nav a { color: #4361ee; text-decoration: none; margin: 0 8px; }
    .empty { text-align: center; color: #aaa; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>📊 Election Results</h1>
    <p class="subtitle">Live vote counts — refreshes every 10 seconds</p>

    <div id="results">
      <p class="empty">Loading results...</p>
    </div>

    <div class="nav">
      <a href="/">← Home</a>
      <a href="/vote">Vote Page</a>
    </div>
  </div>

  <script>
    function loadResults() {
      fetch("/vote/results")
        .then(r => r.json())
        .then(data => {
          const container = document.getElementById("results");

          if (data.length === 0) {
            container.innerHTML = '<p class="empty">No contestants registered yet.</p>';
            return;
          }

          const totalVotes = data.reduce((sum, c) => sum + c.voteCount, 0);
          const maxVotes = Math.max(...data.map(c => c.voteCount), 1);

          container.innerHTML = data.map((c, i) => {
            const pct = totalVotes > 0 ? Math.round((c.voteCount / totalVotes) * 100) : 0;
            const barWidth = Math.round((c.voteCount / maxVotes) * 100);
            const isWinner = i === 0 && c.voteCount > 0;
            return `
              <div class="result-item">
                <div class="result-header">
                  <span class="result-name">
                    ${c.name}
                    ${isWinner ? '<span class="winner-badge">🏆 Leading</span>' : ""}
                  </span>
                  <span class="result-votes">${c.voteCount} vote${c.voteCount !== 1 ? "s" : ""} (${pct}%)</span>
                </div>
                <div class="bar-bg">
                  <div class="bar-fill" style="width: ${barWidth}%"></div>
                </div>
              </div>
            `;
          }).join("");
        })
        .catch(() => {
          document.getElementById("results").innerHTML = '<p class="empty">Error loading results.</p>';
        });
    }

    loadResults();
    setInterval(loadResults, 10000); // refresh every 10s
  </script>
</body>
</html>
