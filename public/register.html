<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f0f4ff; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 90%; max-width: 420px; }
    h1 { font-size: 1.6rem; color: #1a1a2e; margin-bottom: 24px; text-align: center; }
    label { display: block; font-size: 0.85rem; color: #555; margin-bottom: 4px; }
    input, select { width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; margin-bottom: 16px; outline: none; transition: border 0.2s; }
    input:focus, select:focus { border-color: #4361ee; }
    button { width: 100%; padding: 12px; background: #4361ee; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; }
    button:hover { background: #3451d1; }
    .msg { margin-top: 14px; padding: 10px; border-radius: 8px; text-align: center; font-size: 0.9rem; display: none; }
    .msg.success { background: #d1fae5; color: #065f46; display: block; }
    .msg.error { background: #fee2e2; color: #991b1b; display: block; }
    .footer { text-align: center; margin-top: 16px; font-size: 0.9rem; color: #666; }
    .footer a { color: #4361ee; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>📋 Register</h1>

    <label>Full Name</label>
    <input type="text" id="name" placeholder="John Doe" />

    <label>Email</label>
    <input type="email" id="email" placeholder="john@example.com" />

    <label>Password</label>
    <input type="password" id="password" placeholder="••••••••" />

    <label>Register as</label>
    <select id="role">
      <option value="elector">Elector (voter)</option>
      <option value="contestant">Contestant (candidate)</option>
    </select>

    <button onclick="register()">Create Account</button>
    <div class="msg" id="msg"></div>

    <div class="footer">
      Already have an account? <a href="/login">Login</a>
    </div>
  </div>

  <script>
    async function register() {
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const role = document.getElementById("role").value;
      const msg = document.getElementById("msg");

      msg.className = "msg";

      const res = await fetch("/auth/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, email, password, role }),
      });
      const data = await res.json();

      if (res.ok) {
        msg.className = "msg success";
        msg.textContent = data.message + " Redirecting to login...";
        setTimeout(() => (location.href = "/login"), 1500);
      } else {
        msg.className = "msg error";
        msg.textContent = data.error;
      }
    }
  </script>
</body>
</html>
